name: Release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: release
env:
  PACKAGE: "@conao3/bunsai"
  VERSION_FILES: apps/server/package.json
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Bump and check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch the release workflow from $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(jq -er '.version' apps/server/package.json)
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq "[.[] | select(.ref == \"refs/tags/v$version\")] | length")
          if [[ "$existing" != 0 ]]; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' apps/server/package.json > apps/server/package.json.tmp
          mv apps/server/package.json.tmp apps/server/package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra files <<< "$VERSION_FILES"
          git commit -m "chore(release): bump $PACKAGE to v$VERSION" -- "${files[@]}"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build
        run: bun build apps/server/src/index.ts --target=bun --outdir="$RUNNER_TEMP/bunsai-build"
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run fmt:check
      - name: Check STATUS.md
        run: bun maint/bin/gen-status.ts --check
      - name: Terraform smoke test
        run: bun maint/bin/terraform-smoke.ts
      - name: CLI smoke test
        run: bun maint/bin/cli-smoke.ts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Verify package
        run: |
          cp README.md apps/server/README.md
          cd apps/server
          npm publish --dry-run --access public
          rm README.md
      - name: Bundle the version commit
        run: git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          retention-days: 1

  tag:
    name: Push commit and tag
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}
      - name: Push commit and tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          if [[ "$(git rev-parse "$commit^")" != "$GITHUB_SHA" ]]; then
            echo "::error::The version commit is not a child of $GITHUB_SHA."
            exit 1
          fi
          read -ra allowed <<< "$VERSION_FILES"
          while read -r file; do
            if [[ " ${allowed[*]} " != *" $file "* ]]; then
              echo "::error::The version commit changes $file."
              exit 1
            fi
          done < <(git diff --name-only "$GITHUB_SHA" "$commit")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$PACKAGE v$VERSION" "$commit"
          git push --atomic origin "$commit:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

  build:
    name: Build binary
    needs: [check, tag]
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: bunsai-linux-x64
          - target: bun-darwin-arm64
            artifact: bunsai-darwin-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bun build --compile apps/server/src/index.ts --target="$TARGET" --outfile "dist-release/$ARTIFACT"
      - env:
          ARTIFACT: ${{ matrix.artifact }}
        working-directory: dist-release
        run: sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/*

  publish:
    name: Publish to npm
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ env.PACKAGE }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: cp README.md apps/server/README.md
      - working-directory: apps/server
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bunsai-*
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$PACKAGE v$VERSION" --generate-notes artifacts/*
